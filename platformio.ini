[platformio]
build_cache_dir = ~/.pio/build_cache

[env:m5stack-cardputer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB

upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DARDUINO_M5STACK_CARDPUTER
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    m5stack/M5Cardputer
    m5stack/M5GFX
    m5stack/M5Unified
    bblanchon/ArduinoJson@^7
    h2zero/NimBLE-Arduino@^2.2.0

[env:test-keyboard]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB

upload_speed = 1500000
monitor_speed = 115200

build_flags =
    -DARDUINO_M5STACK_CARDPUTER
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    m5stack/M5Cardputer
    m5stack/M5GFX
    m5stack/M5Unified

src_filter = -<**> +<../test_kb/test_keyboard.cpp>

